services:
  db:
    image: postgis/postgis:17-3.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_city}
      POSTGRES_USER: ${POSTGRES_USER:-smart_city}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - private_media:/app/private_media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
  scheduler:
    build: .
    command: python manage.py run_scheduler
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
  checks:
    build: .
    env_file: .env
    profiles: ["checks"]
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m pip install --no-cache-dir --timeout 120 --retries 10 -r requirements/dev.txt && python manage.py makemigrations --check --dry-run && pytest -q && ruff check . && bandit -r apps -ll && pip-audit -r requirements/base.txt"]
  caddy:
    image: caddy:2.11.9-alpine
    profiles: ["production"]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
  worker:
    build: .
    command: python manage.py run_ai_worker
    env_file: .env
    profiles: ["ai"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  private_media:
  caddy_data:
  caddy_config:
