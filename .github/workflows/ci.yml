name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_DB: smart_city
          POSTGRES_USER: smart_city
          POSTGRES_PASSWORD: smart_city
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_city -d smart_city"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: smart_city
      POSTGRES_USER: smart_city
      POSTGRES_PASSWORD: smart_city
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: python -m pip install -r requirements/dev.txt
      - run: ruff check .
      - run: pytest
      - run: pip-audit -r requirements/base.txt
      - run: python manage.py check --deploy --settings=config.settings.prod
