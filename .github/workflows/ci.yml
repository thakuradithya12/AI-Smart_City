name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_DB: smart_city
          POSTGRES_USER: smart_city
          POSTGRES_PASSWORD: smart_city
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_city -d smart_city"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: smart_city
      POSTGRES_USER: smart_city
      POSTGRES_PASSWORD: smart_city
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-only-test-key-with-more-than-fifty-characters-not-a-production-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gdal-bin libgdal-dev libgeos-dev libproj-dev
      - run: python -m pip install -r requirements/dev.txt
      - run: ruff check .
      - run: bandit -r apps -ll
      - run: pytest
      - run: pip-audit -r requirements/base.txt
      - run: python manage.py check --deploy --settings=config.settings.prod
