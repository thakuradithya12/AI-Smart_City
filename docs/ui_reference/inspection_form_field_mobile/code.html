</head>
<body class="bg-app-background text-on-surface font-body antialiased">

  <div class="min-h-[884px] flex flex-col max-w-md mx-auto bg-app-background pb-24" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Contextual Header -->
    <header class="bg-primary text-on-primary px-lg py-md flex items-center justify-between gap-sm sticky top-0 z-20">
      <div class="flex items-center gap-sm min-w-0">
        <a href="#task-detail" aria-label="Back to work order" class="w-10 h-10 rounded flex items-center justify-center hover:bg-primary-action/20 shrink-0">
          <i data-lucide="arrow-left" class="w-5 h-5 text-on-primary" aria-hidden="true"></i>
        </a>
        <div class="min-w-0">
          <div data-design-text-token="mono-sm" class="font-mono text-mono-sm text-outline">WO-2026-0896</div>
          <div data-design-text-token="title-md" class="font-title text-title-md text-on-primary truncate">Site inspection form</div>
        </div>
      </div>
      <span class="px-sm py-0.5 rounded-full bg-warning-container text-on-warning-container font-label text-label-sm shrink-0">High</span>
    </header>

    <!-- Main Form -->
    <main class="flex-1 p-lg flex flex-col gap-lg">
      <section class="bg-surface border border-outline-variant rounded-md p-lg flex flex-col gap-md">
        <div>
          <label for="insp-result" class="block font-label text-label-md text-primary mb-xs">Inspection result</label>
          <select id="insp-result" class="w-full px-md py-sm rounded border border-outline-variant bg-surface font-body text-body-md text-primary">
            <option>Confirmed pressure drop — valve repair needed</option>
            <option>Confirmed main leak</option>
            <option>No fault found on city main</option>
          </select>
        </div>

        <div>
          <label for="insp-severity" class="block font-label text-label-md text-primary mb-xs">Assessed severity</label>
          <select id="insp-severity" class="w-full px-md py-sm rounded border border-outline-variant bg-surface font-body text-body-md text-primary">
            <option>High — repair within 4 hours</option>
            <option>Critical — immediate shutoff</option>
            <option>Medium — scheduled maintenance</option>
          </select>
        </div>

        <div>
          <label for="insp-equip" class="block font-label text-label-md text-primary mb-xs">Equipment / parts required</label>
          <input id="insp-equip" type="text" value="6-inch pressure gauge, valve key" class="w-full px-md py-sm rounded border border-outline-variant bg-surface font-body text-body-md text-primary">
        </div>

        <div>
          <label for="insp-notes" class="block font-label text-label-md text-primary mb-xs">Field assessment notes</label>
          <textarea id="insp-notes" rows="3" class="w-full px-md py-sm rounded border border-outline-variant bg-surface font-body text-body-sm text-primary">Static pressure reads 34 PSI (normal 60 PSI) at 412 W. Main St meter pit. Recommend isolating north block valve.</textarea>
        </div>

        <label class="flex items-center gap-md p-sm rounded bg-surface-container-low border border-outline-variant">
          <input type="checkbox" checked class="w-5 h-5 rounded border-outline text-primary-action">
          <span data-design-text-token="body-sm" class="font-body text-body-sm text-primary">Requires follow-up repair crew</span>
        </label>
      </section>
    </main>

    <!-- Fixed Bottom Submit Bar -->
    <footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-surface border-t border-outline-variant p-md z-30">
      <button type="button" class="w-full min-h-11 inline-flex items-center justify-center gap-xs rounded bg-primary-action text-on-primary-action font-label text-title-md hover:bg-primary">
        <i data-lucide="clipboard-check" class="w-4 h-4" aria-hidden="true"></i>
        <span>Submit inspection report</span>
      </button>
    </footer>
  </div>

  <script>
    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>


</body></html>
