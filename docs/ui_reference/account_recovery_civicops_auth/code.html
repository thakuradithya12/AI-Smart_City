<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">

  <title>Account Recovery — CivicOps</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        'on-surface-variant': '#475569',
        'secondary-text': '#475569',
        'outline': '#CBD5E1',
        'outline-variant': '#E2E8F0',
        'success': '#15803D',
        'on-success': '#FFFFFF',
        'success-container': '#DCFCE7',
        'on-success-container': '#14532D',
        'warning': '#D97706',
        'on-warning': '#0F172A',
        'warning-container': '#FEF3C7',

        'md': '12px',

        '2xl': '32px',
        '3xl': '40px',
        '4xl': '48px',
      },
      fontFamily: {
        'display': ['"Inter"', 'sans-serif'],
        'headline': ['"Inter"', 'sans-serif'],
        'title': ['"Inter"', 'sans-serif'],
        'body': ['"Inter"', 'sans-serif'],
        'label': ['"Inter"', 'sans-serif'],
        'mono': ['"JetBrains Mono"', 'monospace'],
      },
      fontSize: {
        'display-sm': ['28px', { lineHeight: '34px', letterSpacing: '-0.5px', fontWeight: '700' }],
        'headline-lg': ['26px', { lineHeight: '32px', letterSpacing: '-0.4px', fontWeight: '600' }],
        'headline-md': ['18px', { lineHeight: '24px', letterSpacing: '-0.2px', fontWeight: '600' }],
        'title-md': ['15px', { lineHeight: '22px', letterSpacing: '-0.1px', fontWeight: '600' }],
        'body-md': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '400' }],

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-app-background text-on-surface font-body antialiased">

  <div class="min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <!-- Public Top Header -->
    <header class="h-14 bg-surface border-b border-outline-variant px-xl flex items-center justify-between">
      <a href="#landing" class="flex items-center gap-sm">
        <div class="w-8 h-8 rounded bg-primary-action flex items-center justify-center shrink-0">
          <i data-lucide="landmark" class="w-4 h-4 text-on-primary-action" aria-hidden="true"></i>
        </div>
        <span data-design-text-token="title-md" class="font-title text-title-md text-primary">CivicOps</span>
      </a>
      <a href="#login" class="inline-flex items-center gap-xs font-label text-label-md text-primary-action hover:underline">
        <i data-lucide="arrow-left" class="w-4 h-4" aria-hidden="true"></i>
        <span>Back to sign in</span>
      </a>
    </header>

    <!-- Centered Recovery Card -->
    <main class="flex-1 flex items-center justify-center p-xl">
      <section class="w-full max-w-md bg-surface border border-outline-variant rounded-lg p-2xl flex flex-col gap-xl">
        <div class="flex flex-col gap-sm">
          <div class="w-10 h-10 rounded-full bg-primary-action-container text-primary-action flex items-center justify-center">
            <i data-lucide="key-round" class="w-5 h-5" aria-hidden="true"></i>
          </div>
          <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-primary">Reset your password</h1>
          <p data-design-text-token="body-sm" class="font-body text-body-sm text-secondary-text">
            Enter your registered email address or municipal ID and we will send a verification code.
          </p>
        </div>

        <form class="flex flex-col gap-md" action="#verify">
          <div>
            <label for="rec-email" class="block font-label text-label-md text-primary mb-xs">Email address</label>
            <input id="rec-email" type="email" placeholder="name@city.gov or resident@example.org" class="w-full px-md py-sm rounded border border-outline-variant bg-surface font-body text-body-md text-primary">
          </div>

          <button type="submit" class="w-full py-md rounded bg-primary-action text-on-primary-action font-label text-title-md hover:bg-primary">
            Send verification code
          </button>
        </form>

        <div class="p-md rounded bg-surface-container-low border border-outline-variant flex items-start gap-sm">
          <i data-lucide="info" class="w-4 h-4 text-primary-action shrink-0 mt-0.5" aria-hidden="true"></i>
          <p data-design-text-token="body-sm" class="font-body text-body-sm text-secondary-text">
            Municipal staff using single sign-on should contact City IT Support for credential resets.
          </p>
        </div>
      </section>
    </main>
  </div>

  <script>
    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>


</body></html>
