<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile &amp; Settings — CivicOps Citizen Portal</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */
globalThis.tailwind = globalThis.tailwind || {};
globalThis.tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        'primary': '#172B4D',
        'on-primary': '#FFFFFF',
        'primary-action': '#3D6FB6',
        'on-primary-action': '#FFFFFF',
        'primary-action-container': '#E8F0FB',
        'on-primary-action-container': '#172B4D',
        'app-background': '#F5F7FA',
        'surface': '#FFFFFF',
        'on-surface': '#0F172A',
        'surface-container-low': '#F8FAFC',
        'surface-container': '#F1F5F9',
        'surface-container-high': '#E2E8F0',
        'on-surface-variant': '#475569',
        'secondary-text': '#475569',
        'outline': '#CBD5E1',
        'outline-variant': '#E2E8F0',
        'success': '#15803D',
        'on-success': '#FFFFFF',
        'success-container': '#DCFCE7',
        'on-success-container': '#14532D',
        'warning': '#D97706',
        'on-warning': '#0F172A',
        'warning-container': '#FEF3C7',
        'on-warning-container': '#78350F',
        'error': '#DC2626',
        'on-error': '#FFFFFF',
        'error-container': '#FEE2E2',
        'on-error-container': '#7F1D1D',
      },
      borderRadius: {
        'sm': '6px',
        'DEFAULT': '8px',
        'md': '10px',
        'lg': '12px',
        'full': '9999px',
      },
      spacing: {
        'xs': '4px',
        'sm': '8px',
        'md': '12px',
        'lg': '16px',
        'xl': '24px',
        '2xl': '32px',
        '3xl': '40px',
        '4xl': '48px',
      },
      fontFamily: {
        'display': ['"Inter"', 'sans-serif'],
        'headline': ['"Inter"', 'sans-serif'],
        'title': ['"Inter"', 'sans-serif'],
        'body': ['"Inter"', 'sans-serif'],
        'label': ['"Inter"', 'sans-serif'],
        'mono': ['"JetBrains Mono"', 'monospace'],
      },
      fontSize: {
        'display-sm': ['28px', { lineHeight: '34px', letterSpacing: '-0.5px', fontWeight: '700' }],
        'headline-lg': ['26px', { lineHeight: '32px', letterSpacing: '-0.4px', fontWeight: '600' }],
        'headline-md': ['18px', { lineHeight: '24px', letterSpacing: '-0.2px', fontWeight: '600' }],
        'title-md': ['15px', { lineHeight: '22px', letterSpacing: '-0.1px', fontWeight: '600' }],
        'body-md': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '400' }],
        'body-sm': ['13px', { lineHeight: '18px', letterSpacing: '0px', fontWeight: '400' }],
        'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.1px', fontWeight: '500' }],
        'label-sm': ['11px', { lineHeight: '16px', letterSpacing: '0.2px', fontWeight: '600' }],
        'mono-sm': ['12px', { lineHeight: '16px', letterSpacing: '0px', fontWeight: '500' }],
      },
      transitionDuration: {
        'state-change': '140ms',
        'surface-enter': '200ms',
        'surface-exit': '150ms',
      },
      transitionDelay: {
        'state-change': '0ms',
        'surface-enter': '0ms',
        'surface-exit': '0ms',
      },
      transitionTimingFunction: {
        'state-change': 'ease-out',
        'surface-enter': 'cubic-bezier(0.2, 0, 0, 1)',
        'surface-exit': 'cubic-bezier(0.3, 0, 1, 1)',
      },
    },
  },
};
if (typeof module !== 'undefined') module.exports = globalThis.tailwind.config;
</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-app-background text-on-surface font-body antialiased">

  <div class="min-h-[884px] flex flex-col max-w-md mx-auto bg-app-background pb-24" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Citizen Header -->
    <header class="bg-surface border-b border-outline-variant px-lg py-md flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-sm">
        <a href="#home" aria-label="Back to home" class="w-10 h-10 rounded flex items-center justify-center text-primary hover:bg-surface-container-low">
          <i data-lucide="arrow-left" class="w-5 h-5" aria-hidden="true"></i>
        </a>
        <h1 data-design-text-token="title-md" class="font-title text-title-md text-primary">Profile &amp; settings</h1>
      </div>
      <span class="px-sm py-0.5 rounded-full bg-success-container text-on-success-container font-label text-label-sm">Verified</span>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-lg flex flex-col gap-lg">
      <!-- Identity Card -->
      <section class="bg-surface border border-outline-variant rounded-md p-lg flex items-center gap-md">
        <div class="w-14 h-14 rounded-full bg-primary-action-container text-on-primary-action-container flex items-center justify-center font-headline text-headline-md shrink-0">
          MC
        </div>
        <div class="min-w-0">
          <div data-design-text-token="title-md" class="font-title text-title-md text-primary">Marcus Chen</div>
          <div data-design-text-token="body-sm" class="font-body text-body-sm text-secondary-text">marcus.chen@example.org</div>
          <div data-design-text-token="label-sm" class="font-label text-label-sm text-primary-action mt-xs">Ward 4 · Oakridge Resident</div>
        </div>
      </section>

      <!-- Contact Details -->
      <section class="bg-surface border border-outline-variant rounded-md p-lg flex flex-col gap-md">
        <h2 data-design-text-token="title-md" class="font-title text-title-md text-primary">Contact information</h2>
        <div>
          <label for="prof-phone" class="block font-label text-label-md text-primary mb-xs">Mobile phone</label>
          <input id="prof-phone" type="tel" value="(503) 555-0148" class="w-full px-md py-sm rounded border border-outline-variant bg-surface font-body text-body-md text-primary">
        </div>
        <div>
          <label for="prof-ward" class="block font-label text-label-md text-primary mb-xs">Default neighborhood</label>
          <select id="prof-ward" class="w-full px-md py-sm rounded border border-outline-variant bg-surface font-body text-body-md text-primary">
            <option>Ward 4 · Oakridge</option>
            <option>Ward 2 · Civic Core</option>
            <option>Ward 1 · Harborview</option>
          </select>
        </div>
        <button type="button" class="w-full py-sm rounded bg-primary-action text-on-primary-action font-label text-label-md hover:bg-primary">Save contact details</button>
      </section>

      <!-- Notification Preferences -->
      <section class="bg-surface border border-outline-variant rounded-md p-lg flex flex-col gap-md">
        <h2 data-design-text-token="title-md" class="font-title text-title-md text-primary">Notification preferences</h2>
        <label class="flex items-center justify-between gap-md">
          <div>
            <div data-design-text-token="label-md" class="font-label text-label-md text-primary">Status &amp; crew updates</div>
            <div data-design-text-token="body-sm" class="font-body text-body-sm text-secondary-text">Notify when a crew is dispatched</div>
          </div>
          <input type="checkbox" checked class="w-5 h-5 rounded border-outline text-primary-action">
        </label>
        <label class="flex items-center justify-between gap-md pt-sm border-t border-outline-variant">
          <div>
            <div data-design-text-token="label-md" class="font-label text-label-md text-primary">Verification reminders</div>
            <div data-design-text-token="body-sm" class="font-body text-body-sm text-secondary-text">Prompt when repairs need confirmation</div>
          </div>
          <input type="checkbox" checked class="w-5 h-5 rounded border-outline text-primary-action">
        </label>
      </section>

      <!-- Account Actions -->
      <section class="bg-surface border border-outline-variant rounded-md p-lg flex flex-col gap-sm">
        <button type="button" class="w-full min-h-11 px-md rounded border border-outline bg-surface font-label text-label-md text-primary hover:bg-surface-container-low flex items-center justify-between">
          <span>Change password</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-secondary-text" aria-hidden="true"></i>
        </button>
        <button type="button" class="w-full min-h-11 px-md rounded border border-outline bg-surface font-label text-label-md text-error hover:bg-error-container flex items-center justify-between">
          <span>Sign out</span>
          <i data-lucide="log-out" class="w-4 h-4" aria-hidden="true"></i>
        </button>
      </section>
    </main>

    <!-- Fixed Mobile Bottom Navigation -->
    <nav aria-label="Citizen bottom navigation" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-surface border-t border-outline-variant px-md py-xs grid grid-cols-4 gap-xs z-30">
      <a href="#home" class="min-h-11 flex flex-col items-center justify-center gap-xs rounded text-secondary-text hover:text-primary">
        <i data-lucide="home" class="w-5 h-5" aria-hidden="true"></i>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Home</span>
      </a>
      <a href="#report" class="min-h-11 flex flex-col items-center justify-center gap-xs rounded text-secondary-text hover:text-primary">
        <i data-lucide="plus-circle" class="w-5 h-5" aria-hidden="true"></i>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Report</span>
      </a>
      <a href="#complaints" class="min-h-11 flex flex-col items-center justify-center gap-xs rounded text-secondary-text hover:text-primary">
        <i data-lucide="file-text" class="w-5 h-5" aria-hidden="true"></i>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">My reports</span>
      </a>
      <a href="#map" class="min-h-11 flex flex-col items-center justify-center gap-xs rounded text-secondary-text hover:text-primary">
        <i data-lucide="map-pin" class="w-5 h-5" aria-hidden="true"></i>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Nearby</span>
      </a>
    </nav>
  </div>

  <script>
    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>


</body></html>
