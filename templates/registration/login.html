{% extends "base.html" %}
{% block title %}Sign in · AI Smart City{% endblock %}
{% block content %}
<section class="login-card" aria-labelledby="login-title">
  <h1 id="login-title">Sign in</h1>
  <p>Use your registered email and password to continue.</p>
  {% if form.errors %}<p class="error" role="alert">Email or password was not accepted.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Email</label>
    <input id="id_username" name="username" type="email" autocomplete="username" required autofocus>
    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
  <p><a href="{% url 'register' %}">Create a citizen account</a></p>
</section>
{% endblock %}
